<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Auth - Pynexia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-header">
    <h1>Welcome</h1>
    <div class="tab-switch">
      <button id="loginTab" class="active">Login</button>
      <button id="registerTab">Register</button>
    </div>
  </div>

  <!-- LOGIN FORM -->
  <form id="loginForm" class="form active-form" novalidate>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" required aria-describedby="loginEmailError">
      <span class="error" id="loginEmailError"></span>
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <div class="password-wrap">
        <input type="password" id="loginPassword" placeholder="••••••••" required aria-describedby="loginPasswordError">
        <button type="button" class="eye" data-target="loginPassword">👁</button>
      </div>
      <span class="error" id="loginPasswordError"></span>
    </div>
    <button type="submit" class="submit-btn">Login</button>
  </form>

  <!-- REGISTER FORM -->
  <form id="registerForm" class="form" novalidate>
    <div class="field">
      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" placeholder="you@example.com" required aria-describedby="regEmailError">
      <span class="error" id="regEmailError"></span>
    </div>
    <div class="field">
      <label for="regPassword">Password (min 8 chars)</label>
      <div class="password-wrap">
        <input type="password" id="regPassword" placeholder="••••••••" required aria-describedby="regPasswordError">
        <button type="button" class="eye" data-target="regPassword">👁</button>
      </div>
      <span class="error" id="regPasswordError"></span>
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm Password</label>
      <div class="password-wrap">
        <input type="password" id="confirmPassword" placeholder="••••••••" required aria-describedby="confirmPasswordError">
        <button type="button" class="eye" data-target="confirmPassword">👁</button>
      </div>
      <span class="error" id="confirmPasswordError"></span>
    </div>
    <button type="submit" class="submit-btn">Create Account</button>
  </form>
</div>
<script src="script.js"></script>
</body>
</html>
